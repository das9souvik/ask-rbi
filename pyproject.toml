[project]
name = "ask-rbi"
version = "0.1.0"
description = "Cited answers from RBI's 2025 Master Directions: hybrid RAG with an evaluation harness"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Souvik Das" }]
dependencies = [
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
app = ["gradio>=5.0", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ask-rbi = "ask_rbi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ask_rbi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
