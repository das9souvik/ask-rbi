# Ask RBI: document manifest (v1, retail banking set)
#
# Source of truth: RBI's consolidated Master Directions issued on 28 November 2025,
# which replaced older Master Directions and withdrew 9,445 circulars.
#
# Each entry needs a stable `id` and the exact RBI `title`.
# `notification_id` is the Id in https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=<n>.
# When it is blank, `ask-rbi fetch` looks the title up on RBI's Master Directions index.
# The fetcher always checks that the page it lands on matches `title` before downloading.

[[doc]]
id = "rbc"
title = "Reserve Bank of India (Commercial Banks – Responsible Business Conduct) Directions, 2025"
short = "Responsible Business Conduct"
notification_id = 13140
topics = ["customer service", "fair practices", "recovery agents", "grievance redressal", "loan conduct"]

